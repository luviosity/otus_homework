services:
  app:
    build:
      context: ./
      dockerfile: docker-build/blog/Dockerfile
    environment:
      BLOG_APP__DB__HOST: pg
      BLOG_APP__DB__PORT: 5432
      BLOG_APP__DB__NAME: ${PG_DB}
      BLOG_APP__DB__USER: ${PG_USER}
      BLOG_APP__DB__PASSWORD: ${PG_PASSWORD}
    command:
      - "uvicorn"
      - "app:app"
      - "--workers"
      - "2"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    depends_on:
      pg:
        condition: service_healthy
    ports:
      - "8000:8000"


  pg:
    image: postgres:18.3-bookworm
    volumes:
      - pg_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${PG_DB}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 2s
      timeout: 1s
      retries: 3


volumes:
  pg_data:
